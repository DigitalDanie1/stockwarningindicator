/* ══════════ 차트 섹션 ══════════ */
.chartFlow{display:flex;flex-direction:column;gap:22px;margin:26px 0 8px}
.chartBox{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:26px 26px 22px}
.cbHead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-bottom:20px}
.cbHead>em{font-style:normal;font-size:14px;font-weight:800;letter-spacing:.1em;color:#071006;background:var(--lime);border-radius:7px;padding:7px 9px;line-height:1;margin-top:4px}
.cbHead h2{font-size:26px;line-height:1.28;letter-spacing:-.02em;margin:0 0 9px;font-weight:800}
.cbPlain{margin:0;font-size:15.5px;line-height:1.78;color:#b3c0c9;max-width:78ch}
.cbCanvas{position:relative;width:100%;display:grid}
.cvBox{position:relative;min-height:0;min-width:0}
.cvBox>canvas{position:absolute;inset:0}
.cbSplit{display:grid;grid-template-rows:1.25fr 1fr;gap:14px;height:100%;min-height:0}
.cbPair{display:grid;grid-template-columns:1fr 1fr;gap:22px;height:100%;min-height:0}
.cbPair figure{margin:0;display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.cbPair figcaption{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:10px;letter-spacing:.02em}

.cbLegend{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px 24px;margin:20px 0 0;padding:16px 0 0;border-top:1px solid var(--line)}
.cbLegend li{display:grid;grid-template-columns:auto 1fr;grid-template-areas:'dot name' '. means';align-items:baseline;gap:3px 9px;font-size:14px;min-width:0}
.cbLegend i{grid-area:dot;width:11px;height:11px;border-radius:3px;border:2px solid transparent;align-self:center}
.cbLegend i.dash{border-style:dashed;border-width:2px;background:transparent!important}
.cbLegend b{grid-area:name;font-weight:700}
.cbLegend span{grid-area:means;color:var(--muted);line-height:1.5;font-size:14px}

.cbSo{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:18px;padding:16px 18px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--lime)}
.cbSo>span{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--lime);white-space:nowrap;padding-top:3px}
.cbSo p{margin:0;font-size:16px;line-height:1.8}
.cbSo b{font-weight:800}
.cbSo.tone-warn{border-left-color:var(--amber)}
.cbSo.tone-warn>span{color:var(--amber)}
.cbSo.tone-danger{border-left-color:var(--red)}
.cbSo.tone-danger>span{color:var(--red)}
.cbSo.tone-safe{border-left-color:var(--green)}
.cbSo.tone-safe>span{color:var(--green)}
.cbNote{margin:13px 0 0;font-size:14px;color:var(--dim);line-height:1.65}

@media(max-width:900px){
  .chartBox{padding:20px 15px 18px;border-radius:11px}
  .cbHead{gap:12px;margin-bottom:16px}
  .cbHead h2{font-size:22px}
  .cbPlain{font-size:15px}
  .cbPair{grid-template-columns:1fr;gap:26px}
  .cbLegend{grid-template-columns:1fr;gap:8px}
  .cbSo{grid-template-columns:1fr;gap:7px;padding:14px 15px}
  .cbSo p{font-size:15.5px}
}

/* ══════════════════════════════════════════════════════════
   KoreanDaniel 시그니처 레이어
   그라디언트 · 글로우 · 워터마크. 뼈대는 그대로 두고 표정만 얹는다.
   ══════════════════════════════════════════════════════════ */
:root{
  --kd-grad:linear-gradient(100deg,#b5f448 0%,#7fe89b 42%,#52d6e9 100%);
  --kd-grad-soft:linear-gradient(100deg,rgba(181,244,72,.16),rgba(82,214,233,.16));
  --kd-glow:0 0 26px rgba(181,244,72,.30);
}

/* 페이지 상단 시그니처 스트라이프 */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:2px;background:var(--kd-grad);z-index:200;pointer-events:none}

/* 워드마크 */
.brand b{background:var(--kd-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.brand>span{position:relative;border-radius:9px;background:var(--kd-grad);box-shadow:0 0 0 1px rgba(181,244,72,.35),0 8px 26px rgba(181,244,72,.26)}
.brand:hover>span{box-shadow:0 0 0 1px rgba(181,244,72,.55),0 10px 34px rgba(181,244,72,.42)}
.brand small{background:var(--kd-grad);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.75}

/* 활성 탭 — 그라디언트 밑줄 + 번짐 */
.top nav button{position:relative;transition:color .18s}
.top nav button.active{border-bottom-color:transparent;color:var(--text)}
.top nav button.active::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--kd-grad);box-shadow:0 0 16px rgba(181,244,72,.55)}
.top nav button.active b{background:var(--kd-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* 라이브 상태 점 — 숨쉬듯 */
.status i{animation:kdPulse 2.6s ease-in-out infinite}
@keyframes kdPulse{0%,100%{box-shadow:0 0 11px var(--green);opacity:1}50%{box-shadow:0 0 20px var(--green);opacity:.62}}

/* 섹션 아이브로우 */
.verdict>span,.intro>span,.intro>div>span,.head span{background:var(--kd-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

/* 점수 링 글로우 */
.ringWrap .ring{filter:drop-shadow(0 0 20px rgba(181,244,72,.13))}
.ringWrap.danger .ring{filter:drop-shadow(0 0 22px rgba(255,105,94,.24))}
.ringWrap.warn .ring{filter:drop-shadow(0 0 22px rgba(241,184,75,.20))}
.ringWrap.safe .ring{filter:drop-shadow(0 0 22px rgba(88,214,162,.20))}

/* 워터마크 — 히어로 뒤에 유령처럼 */
.verdict,.intro{position:relative;overflow:hidden}
.verdict::after,.intro::after{
  content:'KOREANDANIEL';position:absolute;right:-3%;bottom:-26%;
  font-size:clamp(58px,8vw,116px);font-weight:900;letter-spacing:-.05em;line-height:1;
  color:transparent;-webkit-text-stroke:1px rgba(181,244,72,.032);
  pointer-events:none;user-select:none;white-space:nowrap;z-index:0;
}
.verdict>*,.intro>*{position:relative;z-index:1}

/* 사이드바 활성 항목 */
aside button.active{background:var(--kd-grad-soft);border-color:rgba(181,244,72,.28);box-shadow:inset 3px 0 0 var(--lime)}

/* 차트 번호 배지 */
.cbHead>em{background:var(--kd-grad);box-shadow:0 4px 16px rgba(181,244,72,.24)}
.chartBox{transition:border-color .2s}
.chartBox:hover{border-color:#33403a}

/* "그래서" 강조 바 */
.cbSo{position:relative;border-left:0;padding-left:22px}
.cbSo::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;background:var(--kd-grad);box-shadow:0 0 14px rgba(181,244,72,.35)}
.cbSo.tone-warn::before{background:linear-gradient(180deg,#f1b84b,#ff9a5e);box-shadow:0 0 14px rgba(241,184,75,.35)}
.cbSo.tone-danger::before{background:linear-gradient(180deg,#ff695e,#ff9a5e);box-shadow:0 0 14px rgba(255,105,94,.35)}
.cbSo.tone-safe::before{background:linear-gradient(180deg,#58d6a2,#b5f448);box-shadow:0 0 14px rgba(88,214,162,.35)}

@media(max-width:900px){
  .verdict::after,.intro::after{font-size:clamp(44px,14vw,78px);bottom:-16%}
}

/* ══════════════════════════════════════════════════════════
   방향 시스템 — 높으면 나쁜 숫자 / 낮으면 나쁜 숫자
   위험 지표는 "칠해진 칩", 가격은 색 없는 맨 숫자.
   색만으로 가르면 초록이 '올랐다'와 '안전하다' 두 뜻이 되므로
   축을 색이 아니라 형태로 나눈다.
   ══════════════════════════════════════════════════════════ */

/* 방향 배지 */
.dir{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-style:normal;letter-spacing:.02em;
  padding:3px 7px;border-radius:4px;white-space:nowrap;line-height:1;font-weight:600}
.dir i{font-style:normal;font-size:10px;line-height:1}
.dir-up-bad{color:#ff9d94;background:rgba(255,105,94,.10);box-shadow:inset 0 0 0 1px rgba(255,105,94,.20)}
.dir-down-bad{color:#8fd9ff;background:rgba(82,183,233,.10);box-shadow:inset 0 0 0 1px rgba(82,183,233,.22)}
.dir-both-bad{color:#f3cf86;background:rgba(241,184,75,.10);box-shadow:inset 0 0 0 1px rgba(241,184,75,.22)}

/* 위험 지표 값 — 칠해진 칩 */
.riskChip{display:inline-block;padding:3px 9px;border-radius:6px;font-variant-numeric:tabular-nums;
  font-weight:700;line-height:1.25;white-space:nowrap}
.riskChip.lv-safe{color:#062015;background:linear-gradient(180deg,#6fe0b0,#46c98f)}
.riskChip.lv-warn{color:#231703;background:linear-gradient(180deg,#f7cd6e,#e8ad38)}
.riskChip.lv-danger{color:#2a0b09;background:linear-gradient(180deg,#ff8b82,#f4584c)}
.riskChip.lv-none{padding:0;background:none;color:var(--text);font-weight:inherit}
/* 가격 — 칠하지 않는다 */
.plainVal{font-variant-numeric:tabular-nums;color:var(--text)}

/* 티커: 위험 지표 칸만 배경으로 살짝 구분 */
.ticker article.riskTick{background:rgba(255,255,255,.022)}
.ticker b .riskChip{font-size:14px}
.ticker em{display:inline-flex;align-items:center;gap:2px;letter-spacing:.01em}

/* 역지표는 미터가 오른쪽에서 차오른다 */
.drivers article>span.rtl{transform:scaleX(-1)}

/* 링 아래 방향 표시 */
.ringWrap>em{margin-top:7px}

/* 데이터 표 방향 열 */
.dirCell{display:flex}
.dirNone{font-size:11px;color:var(--dim)}

@media(max-width:900px){
  .dir{font-size:10.5px;padding:2px 6px}
  .dir span{display:none}
  .ringWrap>em{display:none}
}

/* ── 쉬운 말 설명 ─────────────────────────────────────── */
.gloss{display:block;font-style:normal;font-size:12px;line-height:1.55;color:var(--muted);margin-top:5px;max-width:46ch}
.metaRow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px}
.drivers article>div{gap:0}
.drivers article>small em{display:block;font-style:normal;color:var(--dim);margin-top:3px}
.trigger>em+.means,.means{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:7px;line-height:1.55}
.data article p{display:flex;flex-direction:column;gap:4px}
.data article .gloss{margin-top:0;font-size:11.5px;max-width:none}
.srcLine{font-size:11px;color:var(--dim)}
@media(max-width:900px){
  .gloss{font-size:11.5px;max-width:none}
  .drivers article .gloss{display:none}
}

/* ── 점수 해부 차트 ─────────────────────────────────── */
.cbSplit.anatomy{grid-template-rows:1fr 92px;gap:18px}

/* ── 꼭대기 7번 기록 ─────────────────────────────────── */
.peakLedger{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:26px;margin-top:-4px}
.plHead h3{font-size:20px;margin:0 0 7px;font-weight:800}
.plHead p{margin:0 0 20px;font-size:13.5px;color:var(--muted)}
.peakLedger article{border-top:1px solid var(--line);padding:20px 0}
.peakLedger article:last-child{padding-bottom:0}
.peakLedger header{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:12px 26px;align-items:baseline}
.peakLedger header>div:first-child b{font-size:16px;font-weight:800;margin-right:9px}
.peakLedger header>div:first-child span{font-size:12.5px;color:var(--muted)}
.plNums{display:grid;grid-template-columns:96px 96px 92px;gap:18px;justify-items:end;text-align:right}
.plNums>span{display:flex;flex-direction:column;gap:2px}
.plNums em{font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.04em}
.plNums strong{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.15}
.plNums small{font-size:11px;color:var(--dim)}
.plDrop strong{color:var(--red)}
.plRise strong{color:var(--green)}
.plBack strong{color:var(--text);font-size:17px}
.plWhy{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;margin-top:15px}
.plWhy p{margin:0;font-size:13.5px;line-height:1.75;color:#b3c0c9}
.plWhy i{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;margin-bottom:6px}
.plTagDown{color:var(--red)}
.plTagUp{color:var(--green)}
@media(max-width:900px){
  .peakLedger{padding:20px 15px}
  .plWhy{grid-template-columns:1fr;gap:12px}
  .peakLedger header{grid-template-columns:1fr}
  .plNums{grid-template-columns:1fr 1fr 1fr;gap:10px;justify-items:start;text-align:left}
  .plNums{gap:16px}
  .plNums strong{font-size:18px}
  .cbSplit.anatomy{grid-template-rows:1fr 78px}
}

/* ══════════ 고점 조건판 ══════════ */
.peakCond{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:28px;margin-top:22px}
.pcHead{display:grid;grid-template-columns:1fr auto;gap:22px 32px;align-items:start;padding-bottom:22px;border-bottom:1px solid var(--line)}
.pcHead>div:first-child>span{font-size:11.5px;letter-spacing:.2em;font-weight:800;background:var(--kd-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pcHead h2{font-size:25px;letter-spacing:-.02em;margin:9px 0 10px;font-weight:800}
.pcHead p{margin:0;font-size:13.5px;line-height:1.8;color:#b3c0c9;max-width:66ch}
.pcScore{display:flex;gap:26px}
.pcScore>div{display:flex;flex-direction:column;gap:5px;text-align:right}
.pcScore em{font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.05em}
.pcScore strong{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.pcScore small{font-size:15px;color:var(--dim);margin-left:2px}

.pcVerdict{margin:22px 0 0;padding:18px 20px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--lime)}
.pcVerdict b{font-size:17px;font-weight:800}
.pcVerdict p{margin:8px 0 0;font-size:13.5px;line-height:1.8;color:#b3c0c9}
.pcVerdict.tone-warn{border-left-color:var(--amber)}
.pcVerdict.tone-danger{border-left-color:var(--red)}
.pcVerdict.tone-safe{border-left-color:var(--green)}
.pcNearest{display:block;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.pcNearest b{font-size:13px;color:var(--text)}

.pcStages{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px}
.pcStage h3{display:flex;align-items:center;gap:10px;font-size:17px;margin:0 0 8px;font-weight:800}
.pcStage h3 span{font-size:11px;font-weight:800;letter-spacing:.08em;color:#071006;background:var(--kd-grad);padding:4px 8px;border-radius:5px}
.pcStageWhy{margin:0 0 16px;font-size:12.5px;line-height:1.7;color:var(--muted)}
.pcStage ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pcRow{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #1a2226}
.pcMark{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:12px}
.pcRow.met .pcMark{background:var(--red);border-color:var(--red);color:#2a0b09;font-weight:900}
.pcBody b{display:block;font-size:13.5px}
.pcBody i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin:4px 0 8px;line-height:1.55}
.pcBar{height:4px;background:#1c2429;border-radius:3px;overflow:hidden}
.pcBar u{display:block;height:100%;text-decoration:none;background:linear-gradient(90deg,var(--green),var(--amber),var(--red))}
.pcRow.met .pcBar u{background:var(--red)}
.pcNums{text-align:right;display:flex;flex-direction:column;gap:3px;min-width:96px}
.pcNums strong{font-size:17px;font-variant-numeric:tabular-nums}
.pcNums small{font-size:11.5px;color:var(--dim)}
.pcRow.met .pcNums small{color:var(--red)}

.pcHistory{margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
.pcHistory h3{font-size:17px;margin:0 0 8px;font-weight:800}
.pcHistory ul{list-style:none;margin:0;padding:0}
.pcHistory li{display:grid;grid-template-columns:78px minmax(120px,1fr) auto 44px 78px;gap:14px;align-items:center;padding:11px 0;border-top:1px solid #1a2226;font-size:13px}
.pcHistory li b{font-variant-numeric:tabular-nums}
.pcHistory li span{color:var(--muted)}
.pcHistory li em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.pcHistory li small{font-size:12px;color:var(--red);text-align:right;font-variant-numeric:tabular-nums}
.pcHistory li.now{background:rgba(181,244,72,.05)}
.pcHistory li.now b,.pcHistory li.now em{color:var(--lime)}
.pcDots{display:flex;gap:5px}
.pcDots i{width:11px;height:11px;border-radius:50%;background:#222a2e}
.pcDots i.on{background:var(--red)}
.pcHistory li.now .pcDots i.on{background:var(--lime)}
.pcNote{margin:24px 0 0;font-size:12px;line-height:1.75;color:var(--dim)}
.pcNote b{color:var(--muted)}

@media(max-width:900px){
  .peakCond{padding:20px 15px}
  .pcHead{grid-template-columns:1fr}
  .pcScore{gap:20px}
  .pcScore>div{text-align:left}
  .pcStages{grid-template-columns:1fr;gap:26px}
  .pcHistory li{grid-template-columns:64px 1fr auto;gap:8px}
  .pcHistory li em,.pcHistory li small{grid-column:3;text-align:right}
  .pcDots i{width:9px;height:9px}
}
.pcWarn{margin:0 0 16px;padding:13px 15px;border-radius:8px;background:rgba(241,184,75,.07);border-left:3px solid var(--amber);font-size:12.5px;line-height:1.75;color:#c9b184}
.pcWarn b{color:var(--amber)}

/* ── 숫자 조판 ─────────────────────────────────────────
   3분마다 갱신되는 값이라 자릿수가 바뀌면 좌우로 밀린다.
   숫자를 보여주는 곳은 전부 고정폭으로. */
.ring strong,.ringVal,.pcNums strong,.pcScore strong,.trigger header strong,
.drivers strong,.plNums strong,.data article strong,.ticker b,.ticker em,
.riskChip,.plainVal,.bt-stat-val,.pcHistory li b,.pcHistory li em,.pcHistory li small
{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

/* ── 한글 자간 ─────────────────────────────────────────
   -5.5% 는 라틴 디스플레이용 값이다. 한글은 자소가 이미 꽉 차 있어
   그만큼 조이면 글자가 서로 붙는다. */
.verdict h1,.intro h1{letter-spacing:-.015em}
.pcHead h2,.head h2,.cbHead h2,.plHead h3{letter-spacing:-.01em}

/* ── 키보드 조작 ───────────────────────────────────────
   outline:none 상태라 Tab 으로 어디에 있는지 보이지 않았다. */
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:3px}
.top nav button:focus-visible,aside button:focus-visible{outline-offset:-2px}

/* ── 움직임 줄이기 ───────────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
/* <small> 기본 0.8em 축소를 막는다 — 크기는 항상 명시적으로 */
small{font-size:inherit}

/* ── 탭 안 목차 ────────────────────────────────────────
   과거 패턴 탭이 9화면이 넘는다. 스크롤로만 찾게 두지 않는다. */
.secNav{display:flex;flex-direction:column;margin:2px 0 10px 13px;padding-left:11px;border-left:1px solid var(--line)}
.secNav button{width:100%;min-height:0;height:auto;display:grid;grid-template-columns:16px 1fr;gap:8px;
  align-items:start;text-align:left;background:none;border:0;color:var(--muted);cursor:pointer;
  padding:7px 6px;border-radius:5px;transition:color .15s,background .15s}
.secNav button:hover{background:rgba(255,255,255,.035);color:var(--text)}
.secNav button i{font-style:normal;font-size:9.5px;color:var(--dim);padding-top:2px;text-align:center}
.secNav button span{font-size:12px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secNav button.on{color:var(--text);background:rgba(181,244,72,.06)}
.secNav button.on i{color:var(--lime)}
.secNav button.on span{font-weight:700}
aside{overflow-y:auto;scrollbar-width:thin}
@media(max-width:900px){.secNav{display:none}}

/* 클래스명 .table 이 Tailwind 의 .table{display:table} 유틸리티와 겹친다.
   display:table 박스에는 overflow 가 적용되지 않아서, 열이 6개인 전체 지표 표가
   좁은 화면에서 스크롤되지 않고 페이지를 통째로 밀고 있었다. */
.table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}


/* ── 가독성 개선 2026-10 ── */
.drivers article.drv{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(190px,240px);align-items:center;gap:20px;min-height:0;padding:18px 4px;border-bottom:1px solid #1a2226}
.drivers article.drv:last-child{border-bottom:0}
.drivers article.drv>em{align-self:start;padding-top:2px;font-size:12px;color:var(--dim)}
.drivers article.drv .drvMain{display:flex;flex-direction:column;align-items:start;gap:6px;min-width:0}
.drivers article.drv .drvMain>b{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.drivers article.drv .gloss{display:block;font-size:13px;line-height:1.55;color:#9aa6ad;margin:0;max-width:44ch}
.drivers article.drv .metaRow{margin-top:4px}
.drivers article.drv .drvRisk{display:grid;grid-template-columns:1fr;justify-items:end;gap:9px}
.drivers article.drv .drvRisk strong{font-size:17px;text-align:right}
.drivers article.drv .riskChip{font-size:17px;font-weight:700;padding:5px 11px;border-radius:7px}
.drvBar{width:100%;height:6px;border-radius:3px;background:#1c2428;overflow:hidden}
.drvBar i{display:block;height:100%;border-radius:3px;background:var(--muted)}
.drv.lv-safe .drvBar i{background:var(--green)}
.drv.lv-warn .drvBar i{background:var(--amber)}
.drv.lv-danger .drvBar i{background:var(--red)}
.drv.lv-none .drvBar i{background:#8fb7cf}
.drivers article.drv .drvRisk small{display:flex;align-items:baseline;gap:2px;width:100%;font-size:12.5px;color:#9aa6ad}
.drivers article.drv .drvRisk small b{font-size:15px;font-weight:700;color:var(--text);margin-left:4px}
.drv.lv-safe .drvRisk small b{color:var(--green)}
.drv.lv-warn .drvRisk small b{color:var(--amber)}
.drv.lv-danger .drvRisk small b{color:var(--red)}
.drivers article.drv .drvRisk small em{display:inline;margin:0 0 0 auto;font-style:normal;font-size:12px;color:var(--dim)}
.dir{font-size:11.5px;padding:3px 8px}
.badge{font-size:12px!important;color:#9aa6ad!important}
.badge i{width:6px;height:6px}

.trigger.trg{padding:22px 2px}
.trigger.trg header{gap:16px;align-items:flex-start}
.trigger.trg header b{font-size:15px;font-weight:700;color:var(--text)}
.trigger.trg .gloss{display:block;font-size:13px;line-height:1.55;color:#9aa6ad;margin:0}
.trigger.trg .trgVal{font-size:26px;font-weight:700;line-height:1;white-space:nowrap}
.trigger.trg.ok .trgVal{color:var(--text)}
.trigger.trg.near .trgVal{color:var(--amber)}
.trigger.trg.hit .trgVal{color:var(--red)}
.trgMeter{position:relative;height:8px;margin:16px 0 10px;border-radius:4px;background:#1c2428}
.trgMeter i{display:block;height:100%;border-radius:4px;background:var(--green)}
.trg.near .trgMeter i{background:var(--amber)}
.trg.hit .trgMeter i{background:var(--red)}
.trgMeter span{position:absolute;right:0;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px}
.trgFoot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:#9aa6ad}
.trgFoot b{color:var(--text);font-weight:600}
.trgFoot em{font-style:normal;font-weight:700;font-size:13.5px;color:var(--green)}
.trg.near .trgFoot em{color:var(--amber)}
.trg.hit .trgFoot em{color:var(--red)}
.trigger.trg .means{font-size:13px;color:#9aa6ad;margin-top:10px;line-height:1.6}

@media(max-width:720px){
  .drivers article.drv{grid-template-columns:22px minmax(0,1fr);gap:12px 14px}
  .drivers article.drv .drvRisk{grid-column:2;justify-items:start}
  .drivers article.drv .drvRisk strong{text-align:left}
  .trigger.trg .trgVal{font-size:22px}
}
</style>
